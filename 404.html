<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>参保证明验证</title>
  <style>
    :root {
      --blue: #1a6fb5;
      --blue-dark: #0f4f86;
      --line: #d7e3ef;
      --bg: #f3f6fa;
      --text: #1f2a37;
      --muted: #6b7c8f;
      --ok: #1f8f4e;
      --danger: #c0392b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    .top {
      background: linear-gradient(180deg, #1a6fb5 0%, #155d99 100%);
      color: #fff;
      padding: 18px 16px 22px;
    }
    .top .brand {
      font-size: 13px;
      opacity: 0.9;
      letter-spacing: 0.5px;
    }
    .top h1 {
      margin: 8px 0 0;
      font-size: 22px;
      font-weight: 650;
    }
    .wrap {
      max-width: 560px;
      margin: -12px auto 24px;
      padding: 0 14px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(26, 111, 181, 0.08);
      padding: 18px 16px 16px;
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 14px;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,111,181,.12); }
    .btn {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      font-weight: 650;
      color: #fff;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
    }
    .btn:active { transform: scale(0.99); }
    .btn.secondary {
      background: #fff;
      color: var(--blue-dark);
      border: 1px solid var(--line);
      margin-top: 10px;
    }
    .msg {
      min-height: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--danger);
    }
    .msg.ok { color: var(--ok); }
    .meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      word-break: break-all;
    }
    .result { display: none; margin-top: 14px; }
    .result.show { display: block; }
    .badge {
      display: inline-block;
      background: #e8f6ee;
      color: var(--ok);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 650;
      margin-bottom: 10px;
    }
    .pdf-box {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fafbfc;
      min-height: 280px;
    }
    .pdf-box iframe {
      width: 100%;
      height: 70vh;
      border: 0;
      background: #fff;
    }
    .url-card {
      margin-top: 14px;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, #f7fbff 0%, #eef5fb 100%);
    }
    .url-card .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .url-card .host {
      font-size: 12px;
      color: var(--blue-dark);
      word-break: break-all;
      line-height: 1.5;
    }
    .url-card .path {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 650;
      color: #0b3d66;
      word-break: break-all;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .url-card .expire {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .wx-tip {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">四川人社 · 电子参保证明</div>
    <h1>参保证明验证</h1>
  </div>
  <div class="wrap">
    <div class="card">
      <p class="hint">
        请输入证明上的验证码完成核验。验证通过后可查看完整参保证明文件。
      </p>
      <label for="code">验证码</label>
      <input id="code" type="text" maxlength="32" autocomplete="off" placeholder="请输入验证码" />
      <button class="btn" id="verifyBtn" type="button">立即验证</button>
      <div class="msg" id="msg"></div>
      <div class="url-card">
        <div class="label">电子验证地址（与证明标注一致）</div>
        <div class="host" id="urlHost"></div>
        <div class="path" id="urlPath"></div>
        <div class="expire">验证码有效期至：2026年10月23日</div>
        <span id="pathText" style="display:none;"></span>
      </div>

      <div class="result" id="result">
        <div class="badge">验证通过</div>
        <div class="pdf-box">
          <iframe id="pdfFrame" title="参保证明" allow="fullscreen"></iframe>
        </div>
        <a class="btn secondary" id="openPdf" href="#" target="_blank" rel="noopener">下载 / 新窗口打开证明</a>
        <p class="wx-tip">
          微信中若预览异常，请点击上方按钮，选择「在浏览器打开」或「用其他应用打开」。
        </p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var EXPECTED = 'DUqHy4r3GGNGmGhnu9y1';
      var PDF_URL = 'https://coze-coding-project.tos.coze.site/cli_attachment/2026-07-23/920717777711180_708bf48d71b677159f600c160725ca24_state2.pdf?sign=1784908479-6f9e9267c3-0-7f537c2a6255a1b9adfb845e9dc485300b7b748f506fa3626ad17c465e4431e3';
      var params = new URLSearchParams(location.search);
      var codeFromQuery = params.get("code") || "";
      var typeFromQuery = params.get("type") || "toHtml";

      // 页面内只展示仿官方形态地址（拆成主机+路径，更易读）
      var codeShow = codeFromQuery || EXPECTED;
      var typeShow = typeFromQuery || "toHtml";
      var hostShow = "https://www.schrss.org.cn";
      var pathShow = "/scggfwApp/cbzmyz/toPage.do?code=" + codeShow + "&type=" + typeShow;
      var pathText = hostShow + pathShow;
      var hostEl = document.getElementById("urlHost");
      var pathEl = document.getElementById("urlPath");
      if (hostEl) hostEl.textContent = hostShow;
      if (pathEl) pathEl.textContent = pathShow;
      var hidden = document.getElementById("pathText");
      if (hidden) hidden.textContent = pathText;

            // 路径润色成官方形态，并隐藏地址栏中的长查询参数（验证码已读入输入框/会话）
      try {
        if (codeFromQuery) {
          try { sessionStorage.setItem("cbzm_code", codeFromQuery); } catch (e0) {}
        } else {
          try { codeFromQuery = sessionStorage.getItem("cbzm_code") || ""; } catch (e1) {}
        }
        var pretty = location.pathname.replace(/toPage\.html$/i, "toPage.do");
        if (!/toPage\.do$/i.test(pretty)) {
          var base = location.pathname.indexOf("/cbzm-verify") === 0 ? "/cbzm-verify" : "";
          pretty = base + "/scggfwApp/cbzmyz/toPage.do";
        }
        // 地址栏只保留干净路径，不再显示 ?code=...&type=...
        if (location.pathname + location.search !== pretty) {
          history.replaceState(null, "", pretty);
        }
      } catch (e) {}

      var input = document.getElementById("code");
      if (codeFromQuery) input.value = codeFromQuery;

      function setMsg(text, ok) {
        var el = document.getElementById("msg");
        el.textContent = text || "";
        el.className = "msg" + (ok ? " ok" : "");
      }

      function showPdf() {
        document.getElementById("result").classList.add("show");
        document.getElementById("pdfFrame").src = PDF_URL;
        var a = document.getElementById("openPdf");
        a.href = PDF_URL;
        setMsg("验证成功，已加载参保证明。", true);
        try { sessionStorage.setItem("cbzm_ok", "1"); } catch (e) {}
      }

      function verify() {
        var val = (input.value || "").replace(/\s+/g, "");
        if (!val) {
          setMsg("请输入验证码");
          return;
        }
        if (val !== EXPECTED) {
          setMsg("验证码错误，请核对后重试");
          return;
        }
        showPdf();
      }

      document.getElementById("verifyBtn").addEventListener("click", verify);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") verify();
      });

      try {
        if (sessionStorage.getItem("cbzm_ok") === "1" && input.value.replace(/\s+/g, "") === EXPECTED) {
          showPdf();
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
